[package]
name = "pakpos"
version = "0.2.4"
edition = "2024"

[dependencies]
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_10"] }
reqwest = { version = "0.13.4", default-features = false, features = ["multipart", "rustls", "stream"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1.1"
sourceview5 = "0.11.2"
tokio = { version = "1.50", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1.21.0", features = ["v4"] }

[dev-dependencies]
jsonschema = { version = "0.56.0", default-features = false }
tokio = { version = "1.40", features = ["full"] }
