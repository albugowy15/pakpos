[package]
name = "pakpos"
version = "0.4.3"
edition = "2024"

[features]
storage-profiling = ["rusqlite/trace"]

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "multipart",
  "rustls",
  "stream",
] }
rusqlite = { version = "0.40.2", default-features = false, features = [
  "bundled",
] }
mime_guess = "2.0.5"
html5gum = { version = "0.8.4", default-features = false }
roxmltree = "0.21.1"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
sourceview5 = "0.11.2"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
jsonschema = { version = "0.56.0", default-features = false }
tokio = { version = "1.53.1", features = ["full"] }

[[example]]
name = "storage_performance"
required-features = ["storage-profiling"]
