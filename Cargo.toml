[package]
name = "pakpos"
version = "0.2.4"
edition = "2024"

[features]
storage-profiling = ["rusqlite/trace"]

[dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"] }
reqwest = { version = "0.13.5", default-features = false, features = ["multipart", "rustls", "stream"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
sourceview5 = "0.11.2"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
jsonschema = { version = "0.56.0", default-features = false }
tokio = { version = "1.53.1", features = ["full"] }

[[example]]
name = "storage_performance"
required-features = ["storage-profiling"]
